<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML, SCSS, JavaScript, Game, Tower Defense">
    <meta name="author" content="Dominik Żyłkowski">
    <title>FarmWars</title>
    
    <!-- Favicon -->
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="./assets/favicon/favicon.png" sizes="any">
    <link rel="apple-touch-icon" href="./assets/favicon/favicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/css/main.css">
</head>

<body>

<div id="appScale" class="app-scale">

<header class="topBar" id="mainTopBar">
    <!-- 1. LOGO -->
    <div class="topBar__logo">FarmWars</div>

    <!-- 2. PRZYCISKI AKCJI (SKLEP) -->
    <div class="topBar__actions">
        <div class="shop-item shop-item--demolition" id="demolitionControl">
            <button class="topBar__button topBar__remove" id="removeBuildingButton" type="button" aria-pressed="false"
                aria-label="Rozbiórka" aria-describedby="demolitionHint" title="Usuń obiekt z planszy i odzyskaj 25% kosztu budowy.">
                <span class="topBar__hammer" aria-hidden="true"></span>
                <span class="topBar__remove-label">Rozbiórka</span>
            </button>
            <span class="shop-item__cost" id="demolitionHint">Zwrot 25%</span>
        </div>
        <div class="shop-item">
            <button class="topBar__button" id="cannonButton">Armata</button>
            <div class="shop-item__costs" id="cannonCosts"></div>
        </div>
        <div class="shop-item">
            <button class="topBar__button" id="seedlingButton">Sadzonka</button>
            <div class="shop-item__costs" id="seedlingCosts"></div>
        </div>
        <div class="shop-item">
            <button class="topBar__button" id="woodFenceButton">Płot</button>
            <div class="shop-item__costs" id="woodFenceCosts"></div>
        </div>
        <div class="shop-item">
            <button class="topBar__button" id="stoneWallButton">Murek</button>
            <div class="shop-item__costs" id="stoneWallCosts"></div>
        </div>
        <div class="shop-item">
            <button class="topBar__button topBar__button--quarry" id="quarryButton">Kamieniołom</button>
            <div class="shop-item__costs" id="quarryCosts"></div>
        </div>
    </div>

    <!-- 3. STATUS (TIMER I POZIOM) - Centralny szeroki panel -->
    <div class="topBar__status" id="statusContainer">
        <span class="topBar__timer-label">
            Atak za <strong id="prepTimer">2:00</strong>
        </span>
        <div class="topBar__level">
            Fala <strong id="levelDisplay">1</strong>
        </div>
    </div>

    <!-- 4. ZASOBY I KONTROLA - Prawa strona -->
    <div class="topBar__right-side">
        <div class="topBar__resources">
            <span class="topBar__resource topBar__resource--seeds">
                <img class="topBar__resource-icon" src="./assets/images/seeds.png" alt="Nasiona">
                <span class="topBar__resource-value topBar__resource-seeds-count">0</span>
            </span>
            <span class="topBar__resource topBar__resource--wood">
                <img class="topBar__resource-icon" src="./assets/images/log.png" alt="Drewno">
                <span class="topBar__resource-value topBar__resource-wood-count">0</span>
            </span>
            <span class="topBar__resource topBar__resource--stone">
                <img class="topBar__resource-icon" src="./assets/images/stone.png" alt="Kamień">
                <span class="topBar__resource-value topBar__resource-stone-count">0</span>
            </span>
        </div>

        <div class="topBar__resource topBar__score" aria-label="Wynik gracza">
            <span>Score:</span>
            <strong id="scoreDisplay">0</strong>
            <span>pkt</span>
        </div>

        <!-- Przycisk MENU (otwiera menu/pauzę) -->
        <button class="topBar__menu-btn" id="menuGameButton">MENU</button>

        <!-- Informacja o koszcie pod surowcami -->
        <div class="topBar__cost-preview" id="currentSelectionPanel">
            <span id="costDetails"></span>
        </div>
    </div>
</header>

<main class="game-core">
    <section class="game-core__stage">
        <div class="game-board" id="gameBoard">
            <!-- Slot na dom gracza (Lewa strona) -->
            <div class="game-board__house-slot">
                <img src="./assets/images/house.png" alt="Domek" id="playerHouse" />
            </div>
            
            <!-- Siatka gry (Prawa strona) -->
            <div class="game-board__grid" id="gameGrid">
                <!-- Kafelki (tiles) generowane przez JS -->
            </div>
        </div>
    </section>
</main>

<section class="building-upgrade" id="buildingUpgrade" aria-labelledby="buildingUpgradeTitle" hidden>
    <div class="building-upgrade__header">
        <img id="buildingUpgradeIcon" alt="">
        <h2 id="buildingUpgradeTitle"></h2>
        <span class="building-upgrade__level" id="buildingUpgradeLevel"></span>
    </div>
    <p class="building-upgrade__production" id="buildingUpgradeProduction"></p>
    <button type="button" id="upgradeBuildingButton"></button>
    <button type="button" id="closeBuildingUpgradeButton">Zamknij</button>
</section>

<!-- Samouczek -->
<div class="tutorial is-hidden" id="tutorialOverlay" aria-live="polite">
    <div class="tutorial__panel">
        <div class="tutorial__header">
            <span class="tutorial__title" id="tutorialStepTitle">Samouczek</span>
            <span class="tutorial__progress" id="tutorialStepProgress"></span>
        </div>
        <p class="tutorial__text" id="tutorialStepText"></p>
        <div class="tutorial__actions">
            <button class="tutorial__button" id="tutorialNextButton" type="button">Dalej</button>
            <button class="tutorial__button tutorial__button--sub" id="tutorialSkipButton" type="button">Pomiń samouczek</button>
        </div>
    </div>
</div>

<!-- Menu Startowe / Overlay Pauzy -->
<div class="menu menu--overlay" id="gameMenu">
    <h1 class="menu__title">FarmWars</h1>
    <section class="saved-game" id="savedGameChoice" aria-labelledby="savedGameTitle" hidden>
        <h2 id="savedGameTitle">Zapisana rozgrywka</h2>
        <button class="saved-game__continue" id="continueSavedGameButton" type="button">Kontynuuj grę</button>
        <button class="saved-game__restart" id="restartSavedGameButton" type="button">Zacznij od nowa</button>
        <small>Rozpoczęcie od nowa zastąpi poprzedni zapis.</small>
    </section>
    <div class="menu__button-group">
        <!-- Ten przycisk służy zarówno do startu, jak i do wznowienia (Resume) -->
        <button class="menu__button" id="startGameButton" type="button">ZAGRAJ</button>
        <button class="ranking__button" id="rankingButton" type="button">RANKING</button>
        
        <section class="speed-settings" aria-labelledby="gameSpeedLabel">
            <div class="speed-control">
                <label id="gameSpeedLabel" for="volumeRange">Szybkość rozgrywki</label>
                <output id="gameSpeedValue" for="volumeRange">1,00×</output>
                <input type="range" id="volumeRange" min="0.75" max="3" step="0.25" value="1" aria-describedby="gameDifficultyValue">
                <p class="speed-control__current">Poziom: <strong id="gameDifficultyValue">Normal</strong></p>
            </div>
            <div class="speed-bands" aria-label="Przedziały poziomów trudności">
                <div class="speed-bands__band" data-speed-level="Easy"><strong>Easy</strong><span>0,75×</span></div>
                <div class="speed-bands__band" data-speed-level="Normal"><strong>Normal</strong><span>1,00× – 1,50×</span></div>
                <div class="speed-bands__band" data-speed-level="Hard"><strong>Hard</strong><span>1,75× – 2,25×</span></div>
                <div class="speed-bands__band" data-speed-level="Very Hard"><strong>Very Hard</strong><span>2,50× – 3,00×</span></div>
            </div>
        </section>
    </div>
</div>

</div>

<!-- Scripts -->
 <script src="./js/config.js"></script>
 <script src="./js/runtime.js"></script>
 <script src="./js/score.js"></script>
 <script src="./js/ranking.js"></script>
 <script src="./js/ranking_ui.js"></script>
 <script src="./js/game_model.js"></script>
 <script src="./js/war_logic.js"></script>
 <script src="./js/game_view.js"></script>
 <script src="./js/economy_client.js"></script>
<script src="./js/main.js"></script>

</body>
</html>
